<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=600, height=600, initial-scale=1.0, user-scalable=no">
  <title>Translation Display</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <script src="config.js"></script>
</head>
<body>
  <div id="app">
    <div id="home" class="screen">
      <header class="header">
        <h1>Translations</h1>
        <span class="header-meta" id="status-indicator">Connecting...</span>
      </header>
      <div class="content">
        <div id="messages-list" class="list-container">
          <div class="loading-container">
            <div class="loading-spinner"></div>
            <div class="loading-text">Waiting for translations...</div>
          </div>
        </div>
      </div>
      <nav class="nav-bar">
        <button class="nav-item focusable" data-action="clear">Clear</button>
        <button class="nav-item focusable" data-action="settings">Settings</button>
      </nav>
    </div>

    <div id="settings" class="screen hidden">
      <header class="header">
        <button class="back-btn focusable" data-action="back">&#8592;</button>
        <h1>Settings</h1>
      </header>
      <div class="content">
        <div class="card focusable" tabindex="0" data-action="toggle-scroll">
          <div class="card-title">Auto-scroll</div>
          <div class="card-subtitle" id="scroll-mode-label">Enabled</div>
        </div>
        <div class="card focusable" tabindex="0" data-action="toggle-speed">
          <div class="card-title">Scroll Speed</div>
          <div class="card-subtitle" id="speed-label">Normal</div>
        </div>
        <div class="card">
          <div class="card-title">Server URL</div>
          <div class="card-subtitle" id="server-url">Configured</div>
        </div>
      </div>
    </div>

    <div id="access-denied" class="screen hidden">
      <header class="header">
        <h1>Access Denied</h1>
      </header>
      <div class="content">
        <div class="card">
          <div class="access-denied-icon">&#9888;</div>
          <div class="card-title">Unauthorized Access</div>
          <div class="card-subtitle access-denied-message">
            This translation display requires a valid access token.<br>
            Please use the correct URL to access.
          </div>
        </div>
        <div id="countdown-timer" class="loading-container">
          <div class="loading-spinner"></div>
          <div class="loading-text" id="countdown-text">Retrying in 5 seconds...</div>
        </div>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
